<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MagicWish - Elegant & Professional Wish Creator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #f7f9fc;
            color: #2d3748;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 15px;
            overflow-y: auto;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            border: 1px solid #edf2f7;
            padding: 25px;
            position: relative;
            margin-bottom: 30px;
        }

        /* Clean Header & Menu */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #edf2f7;
            padding-bottom: 12px;
        }
        .brand-title {
            font-size: 18px;
            font-weight: 700;
            color: #4a5568;
        }
        .menu-btn {
            background: #edf2f7;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            color: #4a5568;
            cursor: pointer;
        }

        h2 {
            font-size: 18px;
            color: #1a202c;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 14px;
            text-align: left;
        }
        label {
            font-size: 12px;
            color: #718096;
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        input, select, textarea {
            width: 100%;
            padding: 11px 14px;
            background: #fdfdfe;
            border: 1px solid #cbd5e0;
            border-radius: 10px;
            color: #2d3748;
            font-size: 13px;
            outline: none;
            transition: 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        .btn:hover {
            background: #5a67d8;
        }
        .btn-secondary {
            background: #48bb78;
            margin-top: 8px;
        }
        .btn-secondary:hover {
            background: #38a169;
        }

        /* Receiver Experience UI */
        .receiver-view {
            display: none;
            text-align: center;
        }
        .profile-circle {
            width: 100px;
            height: 100px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            border: 3px solid #667eea;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.2);
            background: #edf2f7;
        }
        .profile-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .message-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 16px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.6;
            margin: 15px 0;
            color: #4a5568;
            text-align: left;
            word-break: break-word;
        }

        /* Unlock Area */
        .unlock-card {
            background: #f7fafc;
            border: 2px dashed #cbd5e0;
            padding: 20px;
            border-radius: 12px;
            margin: 15px 0;
            cursor: pointer;
        }

        /* Yes/No Interactive Buttons */
        .decision-area {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            position: relative;
            height: 45px;
        }
        .yes-btn {
            background: #48bb78;
            padding: 8px 20px;
            border-radius: 8px;
            border: none;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        .no-btn {
            background: #e53e3e;
            padding: 8px 20px;
            border-radius: 8px;
            border: none;
            color: white;
            font-weight: 600;
            cursor: pointer;
            position: absolute;
        }

        /* Toast Notification */
        .toast-msg {
            visibility: hidden;
            min-width: 220px;
            background-color: #2d3748;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 10px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 25px;
            transform: translateX(-50%);
            font-size: 13px;
        }
        .toast-msg.show {
            visibility: visible;
            animation: fadeInOut 2.5s;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; bottom: 10px; }
            20% { opacity: 1; bottom: 25px; }
            80% { opacity: 1; bottom: 25px; }
            100% { opacity: 0; bottom: 10px; }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <span class="brand-title">✨ MagicWish</span>
            <button class="menu-btn" onclick="openHistory()">मेरी हिस्ट्री (History)</button>
        </div>

        <!-- Creator Form Section -->
        <div id="creatorSection">
            <h2>सुंदर विश लिंक बनाएं</h2>
            <div class="form-group">
                <label>जिसे भेजना है उनका नाम</label>
                <input type="text" id="receiverName" placeholder="जैसे: Rohit">
            </div>
            <div class="form-group">
                <label>फोटो का लिंक (Image URL)</label>
                <input type="text" id="imageUrl" placeholder="पिक्चर लिंक यहाँ पेस्ट करें">
            </div>
            <div class="form-group">
                <label>बैकग्राउंड म्यूजिक (YouTube Link - Optional)</label>
                <input type="text" id="youtubeUrl" placeholder="जैसे: https://youtu.be/...">
            </div>
            <div class="form-group">
                <label>आपका प्यारा मैसेज</label>
                <textarea id="customMessage" rows="3" placeholder="दिल की बात यहाँ लिखें..."></textarea>
            </div>
            <div class="form-group">
                <label>आपका नाम (Sender Name)</label>
                <input type="text" id="senderName" placeholder="आपका नाम">
            </div>
            <button class="btn" onclick="generateWishLink()">लिंक जनरेट करें 🚀</button>
        </div>

        <!-- Share & Copy Section -->
        <div id="shareSection" class="hidden" style="text-align: center;">
            <h2>तैयार हो गया आपका लिंक!</h2>
            <p style="font-size: 12px; color: #718096; margin-bottom: 12px;">नीचे दिए गए बटन से लिंक कॉपी करें या सीधे शेयर करें:</p>
            <input type="text" id="resultLinkBox" readonly style="text-align: center; margin-bottom: 10px; font-size: 11px;">
            <button class="btn" onclick="copyLinkText()">लिंक कॉपी करें 📋</button>
            <button class="btn btn-secondary" onclick="shareOnWhatsApp()">WhatsApp पर भेजें 🟢</button>
            <button class="menu-btn" style="width: 100%; margin-top: 10px;" onclick="location.reload()">नया लिंक बनाएँ 🔄</button>
        </div>

        <!-- Receiver View Section -->
        <div id="receiverSection" class="receiver-view">
            <h2 id="receiverMainTitle">आपके लिए एक सरप्राइज! 🎁</h2>
            <div id="unlockBox" class="unlock-card" onclick="revealWishMessage()">
                <p style="font-size: 13px; font-weight: 500; color: #4a5568;">अनलॉक करने के लिए यहाँ टैप करें 👇</p>
                <span style="font-size: 28px; display: block; margin-top: 8px;">🎁</span>
            </div>

            <div id="revealedContent" class="hidden">
                <div class="profile-circle">
                    <img id="viewImg" src="" alt="Photo" onerror="this.src='https://images.unsplash.com/photo-1513151233558-d860c5398176?w=300'">
                </div>
                <h1 id="viewReceiver" style="font-size: 20px; color: #2d3748; margin-bottom: 8px; font-weight: 700;"></h1>
                <div class="message-box" id="viewMessage"></div>
                <h3 id="viewSender" style="font-size: 13px; color: #4a5568; font-weight: 600;"></h3>

                <!-- Fun Question -->
                <div style="margin-top: 20px;">
                    <p style="font-size: 12px; font-weight: 600; color: #718096; margin-bottom: 8px;">कैसा लगा यह सरप्राइज?</p>
                    <div class="decision-area">
                        <button class="yes-btn" onclick="alert('❤️ बहुत-बहुत शुक्रिया! आपका दिन मंगलमय हो!')">बहुत अच्छा! 😍</button>
                        <button class="no-btn" id="noButton" onmouseover="moveNoBtn()" ontouchstart="moveNoBtn()">बिल्कुल नहीं 😜</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast-msg">लिंक कॉपी हो गया है! 📋</div>
    <!-- Firebase SDK Scripts (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        // आपके द्वारा दी गई Firebase कॉन्फ़िगरेशन डिटेल्स
        const firebaseConfig = {
            apiKey: "AIzaSyBlYdZlJsnNcZv1ky187-spvhIH7235UTk",
            authDomain: "cyberwish-521fd.firebaseapp.com",
            databaseURL: "https://cyberwish-521fd-default-rtdb.firebaseio.com/",
            projectId: "cyberwish-521fd",
            storageBucket: "cyberwish-521fd.appspot.com",
            messagingSenderId: "150188886863",
            appId: "1:150188886863:web:c04bac173f7a141732933a",
            measurementId: "G-9MM6BPL2H1"
        };

        // Firebase इनिशियलाइज करें
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // पेज लोड होने पर चेक करें कि क्या URL में विश आईडी (id) मौजूद है
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const wishId = urlParams.get('id');

            if (wishId) {
                // अगर आईडी है, तो Firebase डेटाबेस से डेटा फेच करें
                database.ref('wishes/' + wishId).once('value').then((snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        document.getElementById('creatorSection').classList.add('hidden');
                        document.getElementById('receiverSection').style.display = 'block';

                        document.getElementById('viewReceiver').innerText = data.receiver;
                        document.getElementById('viewMessage').innerText = data.message;
                        document.getElementById('viewSender').innerText = `From: ${data.sender}`;
                        if (data.image) {
                            document.getElementById('viewImg').src = data.image;
                        }
                    } else {
                        alert('यह विश लिंक या तो एक्सपायर हो गया है या मौजूद नहीं है!');
                    }
                });
            }
        }

        // लिंक जनरेट करें और Firebase डेटाबेस में सेव करें
        function generateWishLink() {
            const receiver = document.getElementById('receiverName').value.trim();
            const image = document.getElementById('imageUrl').value.trim();
            const youtube = document.getElementById('youtubeUrl').value.trim();
            const message = document.getElementById('customMessage').value.trim();
            const sender = document.getElementById('senderName').value.trim();

            if (!receiver || !message || !sender) {
                alert('कृपया सभी जरूरी जानकारी भरें!');
                return;
            }

            // एक यूनीक आईडी बनाएं
            const newWishRef = database.ref('wishes').push();
            const wishId = newWishRef.key;

            // डेटाबेस में सेव करें
            newWishRef.set({
                receiver: receiver,
                image: image,
                youtube: youtube,
                message: message,
                sender: sender,
                timestamp: Date.now()
            }, (error) => {
                if (error) {
                    alert('डेटा सेव करने में कुछ एरर आया!');
                } else {
                    // लोकल स्टोरेज में भी हिस्ट्री सेव करें ताकि क्रिएटर अपनी बनाई विश देख सके
                    saveToLocalHistory(wishId, receiver);

                    const baseURL = window.location.origin + window.location.pathname;
                    const finalLink = `${baseURL}?id=${wishId}`;

                    document.getElementById('creatorSection').classList.add('hidden');
                    document.getElementById('shareSection').classList.remove('hidden');
                    document.getElementById('resultLinkBox').value = finalLink;
                }
            });
        }

        // ब्राउज़र के LocalStorage में हिस्ट्री सेव करने का फंक्शन
        function saveToLocalHistory(id, name) {
            let history = JSON.parse(localStorage.getItem('myWishes') || '[]');
            history.push({ id: id, name: name, date: new Date().toLocaleDateString() });
            localStorage.setItem('myWishes', JSON.stringify(history));
        }

        // हिस्ट्री देखने का फंक्शन (मेनू बटन के लिए)
        function openHistory() {
            let history = JSON.parse(localStorage.getItem('myWishes') || '[]');
            if (history.length === 0) {
                alert('आपने अभी तक कोई विश लिंक नहीं बनाया है!');
                return;
            }
            let msg = "आपके द्वारा बनाए गए पिछले लिंक्स:\n\n";
            history.forEach((item, index) => {
                msg += `${index + 1}. To: ${item.name} (Date: ${item.date})\n`;
            });
            alert(msg);
        }

        // क्लिपबोर्ड पर कॉपी करने का फंक्शन
        function copyLinkText() {
            const box = document.getElementById('resultLinkBox');
            box.select();
            navigator.clipboard.writeText(box.value);

            const toast = document.getElementById('toast');
            toast.className = "toast-msg show";
            setTimeout(() => { toast.className = "toast-msg"; }, 2500);
        }

        // WhatsApp शेयरिंग
        function shareOnWhatsApp() {
            const link = document.getElementById('resultLinkBox').value;
            const text = `✨ आपके लिए एक प्यारा सा सरप्राइज आया है! यहाँ क्लिक करके देखें: ${link}`;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
        }

        // सरप्राइज अनलॉक करने का एनीमेशन
        function revealWishMessage() {
            document.getElementById('unlockBox').classList.add('hidden');
            document.getElementById('revealedContent').classList.remove('hidden');
        }

        // फनी 'ना' (No) बटन को भगाने का फंक्शन (मोबाइल और डेस्कटॉप दोनों के लिए)
        function moveNoBtn() {
            const x = (Math.random() - 0.5) * 160;
            const y = (Math.random() - 0.5) * 60;
            const btn = document.getElementById('noButton');
            btn.style.transform = `translate(${x}px, ${y}px)`;
        }
    </script>
</body>
</html>
